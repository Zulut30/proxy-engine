# Template: nginx edge reverse proxy.
# Replace example.com, proxy-region and certificate paths before use.

upstream app_origin {
    zone app_origin 64k;
    server 127.0.0.1:18443 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:18444 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:18445 max_fails=1 fail_timeout=5s;
    keepalive 64;
}

proxy_cache_path /var/cache/nginx/app levels=1:2 keys_zone=app_cache:100m max_size=25g inactive=7d use_temp_path=off;

map $request_method $skip_method {
    default 1;
    GET 0;
    HEAD 0;
}

map $http_cookie $skip_cookie {
    default 0;
    ~*wordpress_logged_in 1;
    ~*comment_author 1;
    ~*wp-postpass 1;
    ~*w3tc_preview 1;
}

map $request_uri $skip_uri {
    default 0;
    ~^/wp-admin/ 1;
    ~^/wp-login\.php 1;
    ~^/wp-json/ 1;
    ~^/wp-cron\.php 1;
    ~^/xmlrpc\.php 1;
    ~preview=true 1;
}

map "$skip_method$skip_cookie$skip_uri" $skip_cache {
    default 0;
    ~1 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location = /_proxy_health {
        access_log off;
        if (-f /run/proxy-overloaded) {
            add_header X-Proxy-Region proxy-region always;
            return 503 "overloaded proxy-region\n";
        }
        add_header X-Proxy-Region proxy-region always;
        return 200 "ok proxy-region\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate /etc/nginx/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:app_ssl:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_prefer_server_ciphers off;

    add_header X-Proxy-Region proxy-region always;

    access_log /var/log/nginx/example.com.access.log combined buffer=256k flush=5s;
    error_log /var/log/nginx/example.com.error.log warn;

    location = /_proxy_health {
        access_log off;
        if (-f /run/proxy-overloaded) {
            add_header X-Proxy-Region proxy-region always;
            return 503 "overloaded proxy-region\n";
        }
        add_header X-Proxy-Region proxy-region always;
        return 200 "ok proxy-region\n";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";

    proxy_ssl_server_name on;
    proxy_ssl_name example.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

    proxy_connect_timeout 2s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;

    proxy_buffering on;
    proxy_buffers 32 32k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 256k;

    proxy_cache app_cache;
    proxy_cache_key "$scheme:$request_method:$host:$request_uri";
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_lock_age 10s;
    proxy_ignore_headers X-Accel-Expires;

    location ^~ /wp-content/uploads/backup/ {
        access_log off;
        return 404;
    }

    location ~* ^/(?:wp-admin/|wp-login\.php|wp-json/|wp-cron\.php|xmlrpc\.php) {
        proxy_pass https://app_origin;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header X-Proxy-Region proxy-region always;
        add_header X-Proxy-Cache BYPASS always;
    }

    location ~* \.(?:css|js|mjs|json|xml|txt|svg|woff2?|ttf|otf|eot|avif|webp|jpe?g|png|gif|ico|bmp|mp4|webm|pdf|zip)$ {
        proxy_pass https://app_origin;
        proxy_cache_valid 200 301 302 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_bypass $skip_method;
        proxy_no_cache $skip_method $upstream_http_set_cookie;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Proxy-Region proxy-region always;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass https://app_origin;
        proxy_cache_valid 200 301 302 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_bypass $skip_cache;
        proxy_no_cache $skip_cache $upstream_http_set_cookie;
        add_header X-Proxy-Region proxy-region always;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }
}
